<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Me | Justin Ulrich</title>
<meta name="description" content="Get in touch about marketing leadership roles and projects.">
<link rel="canonical" href="https://www.justinulrich.com/contact">
<link rel="icon" type="image/png" href="./assets/favicon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="JustinUlrich.com">
<meta property="og:title" content="Contact Me | Justin Ulrich">
<meta property="og:description" content="Get in touch about marketing leadership roles and projects.">
<meta property="og:url" content="https://www.justinulrich.com/contact">
<meta property="og:image" content="https://www.justinulrich.com/assets/hero-photo.png">
<meta name="twitter:card" content="summary_large_image">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>Contact Me | JustinUlrich.com</title>
  <link rel="icon" type="image/png" href="./assets/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200;300;400;500;600;700&family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { margin:0; background:#FFFFFF; -webkit-font-smoothing:antialiased; }
    a { color:#CE7213; }
    a:hover { color:#E08A2E; }
    input::placeholder, textarea::placeholder { color:#5B646E; opacity:1; }
  </style>
</helmet>

<div style="width:100%;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column">
  <dc-import name="Nav" active="contact" hint-size="100%,72px"></dc-import>

  <section data-screen-label="Contact" style="background:#3F5B7A;flex:1;position:relative">
    <div style="max-width:1080px;margin:0 auto;padding:70px 40px 120px;text-align:center">
      <div style="font-family:Oswald,sans-serif;font-weight:300;font-size:32px;letter-spacing:.5px;color:#93A8BF;margin:0 0 2px">YOU'RE ONE STEP CLOSER TO</div>
      <h1 style="font-family:Oswald,sans-serif;font-weight:500;font-size:44px;letter-spacing:.5px;color:#FFFFFF;margin:0 0 26px;text-wrap:pretty">CREATING THE PERFECT TEAM</h1>
      <p style="font-family:Figtree,sans-serif;font-weight:400;font-size:18px;line-height:1.6;color:#FFFFFF;margin:0;text-wrap:pretty">Let's talk. Send me a message below or shoot me an email to start the conversation.</p>
    </div>
    <div style="max-width:560px;margin:-80px auto 70px;background:#1B2A41;padding:34px 32px 26px">
      <form onSubmit="{{ submit }}" style="display:flex;flex-direction:column;gap:14px">
        <input name="name" type="text" placeholder="Name *" required="" style="font-family:Figtree,sans-serif;font-size:17px;color:#2E3A47;background:#FFFFFF;border:1px solid #FFFFFF;border-radius:3px;padding:12px 14px;width:100%;box-sizing:border-box" />
        <input name="email" type="email" placeholder="Email *" required="" style="font-family:Figtree,sans-serif;font-size:17px;color:#2E3A47;background:#FFFFFF;border:1px solid #FFFFFF;border-radius:3px;padding:12px 14px;width:100%;box-sizing:border-box" />
        <input name="subject" type="text" placeholder="Subject" style="font-family:Figtree,sans-serif;font-size:17px;color:#2E3A47;background:#FFFFFF;border:1px solid #FFFFFF;border-radius:3px;padding:12px 14px;width:100%;box-sizing:border-box" />
        <textarea name="message" placeholder="Message" rows="6" style="font-family:Figtree,sans-serif;font-size:17px;color:#2E3A47;background:#FFFFFF;border:1px solid #FFFFFF;border-radius:3px;padding:12px 14px;width:100%;box-sizing:border-box;resize:vertical"></textarea>
        <div style="display:flex;justify-content:flex-end">
          <button type="submit" style="font-family:Figtree,sans-serif;font-weight:500;font-size:17px;color:#FFFFFF;background:#CE7213;border:0;border-radius:3px;padding:10px 20px;cursor:pointer" style-hover="background:#B5620C">Send</button>
        </div>
      </form>
    </div>
  </section>

  <dc-import name="Footer" hint-size="100%,90px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      submit: (e) => {
        e.preventDefault();
        const f = e.target;
        const g = (n) => (f.elements[n] ? f.elements[n].value.trim() : "");
        const subject = g("subject") || "Website inquiry";
        const body =
          "Name: " + g("name") + "\n" +
          "Email: " + g("email") + "\n\n" +
          g("message");
        window.location.href =
          "mailto:JustinC.Ulrich@gmail.com?subject=" +
          encodeURIComponent(subject) +
          "&body=" +
          encodeURIComponent(body);
      }
    };
  }
}
</script>
</body>
</html>
